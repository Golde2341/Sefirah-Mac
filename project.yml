# Generate with: xcodegen generate
name: Sefirah
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    macOS: "14.0"
  bundleIdPrefix: io.github.madeye
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.4.0
  swift-certificates:
    url: https://github.com/apple/swift-certificates.git
    from: 1.7.0
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: 6.0
    MACOSX_DEPLOYMENT_TARGET: 14.0
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: 1
  configs:
    Release:
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      ENABLE_HARDENED_RUNTIME: YES
targets:
  SefirahCore:
    type: framework
    platform: macOS
    sources:
      - SefirahCore
    dependencies:
      - package: GRDB
        product: GRDB
      - package: swift-certificates
        product: X509
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.madeye.sefirah.mac.core
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  Sefirah:
    type: application
    platform: macOS
    sources:
      - Sefirah
      # Vendored scrcpy — populated by scripts/fetch-scrcpy.sh (run it before `xcodegen generate`;
      # xcodegen fails on missing source paths). Mach-O helpers → Contents/MacOS as nested code,
      # signed on copy with the app identity (+ hardened runtime in Release). Data → Resources/scrcpy.
      - path: Vendor/scrcpy/scrcpy
        buildPhase: { copyFiles: { destination: executables } }
        attributes: [CodeSignOnCopy]
      - path: Vendor/scrcpy/adb
        buildPhase: { copyFiles: { destination: executables } }
        attributes: [CodeSignOnCopy]
      - path: Vendor/scrcpy/scrcpy-server
        buildPhase: { copyFiles: { destination: resources, subpath: scrcpy } }
      - path: Vendor/scrcpy/LICENSE
        buildPhase: { copyFiles: { destination: resources, subpath: scrcpy } }
      - path: Vendor/scrcpy/NOTICES.md
        buildPhase: { copyFiles: { destination: resources, subpath: scrcpy } }
      - path: Vendor/scrcpy/VERSION
        buildPhase: { copyFiles: { destination: resources, subpath: scrcpy } }
    preBuildScripts:
      - name: Check vendored scrcpy
        shell: /bin/bash
        basedOnDependencyAnalysis: false
        script: |
          source "$SRCROOT/scripts/scrcpy.lock"
          V="$SRCROOT/Vendor/scrcpy"
          if [ ! -x "$V/scrcpy" ] || [ ! -x "$V/adb" ] || [ ! -f "$V/scrcpy-server" ]; then
            echo "error: Vendor/scrcpy is missing — run scripts/fetch-scrcpy.sh" >&2; exit 1
          fi
          HAVE="$(cat "$V/VERSION" 2>/dev/null || echo none)"
          if [ "$HAVE" != "$SCRCPY_VERSION" ]; then
            echo "error: Vendor/scrcpy is v$HAVE but scripts/scrcpy.lock pins v$SCRCPY_VERSION — run scripts/fetch-scrcpy.sh" >&2; exit 1
          fi
    dependencies:
      - target: SefirahCore
      # Build-order only: the helper is copied into the app by the script below.
      - target: SefirahNotifications
        link: false
        embed: false
    postBuildScripts:
      - name: Embed Sefirah Phone helper
        shell: /bin/bash
        basedOnDependencyAnalysis: false
        script: |
          set -e
          SRC="$BUILT_PRODUCTS_DIR/Sefirah Phone.app"
          DEST="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Library/Helpers"
          mkdir -p "$DEST"
          rm -rf "$DEST/Sefirah Phone.app"
          if [ -d "$SRC" ]; then
            ditto "$SRC" "$DEST/Sefirah Phone.app"
          else
            echo "warning: helper app not built at $SRC" >&2
          fi
    info:
      path: Sefirah/Info.plist
      properties:
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleDisplayName: Sefirah
        CFBundleName: Sefirah
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.utilities
        ITSAppUsesNonExemptEncryption: false
        NSPrincipalClass: NSApplication
        NSLocalNetworkUsageDescription: Sefirah discovers and connects to your Android phone on the local network.
        NSAppleEventsUsageDescription: Sefirah reads and controls media playing on your Mac from your paired Android device.
        NSBonjourServices:
          - _sefirah._udp
        CFBundleURLTypes:
          - CFBundleURLName: io.github.madeye.sefirah.mac
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - sefirah
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.madeye.sefirah.mac
        # Icon Composer bundle (Sefirah.icon). xcodegen can't model `.icon` folders, so after
        # `xcodegen generate` re-add Sefirah.icon to this target's Resources phase by hand
        # (file type folder.iconcomposer.icon) and keep INCLUDE_ALL_APPICON_ASSETS = NO.
        # Never add an AppIcon.appiconset next to it — Xcode 27's icon export fails when both exist.
        ASSETCATALOG_COMPILER_APPICON_NAME: Sefirah
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        COMBINE_HIDPI_IMAGES: YES
  SefirahNotifications:
    type: application
    platform: macOS
    sources:
      - SefirahNotifications
    info:
      path: SefirahNotifications/Info.plist
      properties:
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleDisplayName: Sefirah Phone
        CFBundleName: Sefirah Phone
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.utilities
        LSUIElement: true
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.madeye.sefirah.phone
        PRODUCT_NAME: Sefirah Phone
        # Icon Composer bundle (SefirahPhone.icon at the repo root). xcodegen can't model `.icon`
        # folders, so after `xcodegen generate` re-add SefirahPhone.icon to this target's Resources
        # phase by hand (file type folder.iconcomposer.icon) and keep INCLUDE_ALL_APPICON_ASSETS = NO.
        # Never add an AppIcon.appiconset next to it — Xcode 27's icon export fails when both exist.
        ASSETCATALOG_COMPILER_APPICON_NAME: SefirahPhone
    postBuildScripts:
      # macOS notification/tray icon slots fall back to the legacy .icns for this nested helper and
      # expose its transparent margins as a light "well" (a thick gray outline). The Icon Composer
      # export is inset by design, so scripts/fullbleed-legacy-icon.sh swaps in an edge-to-edge
      # render before the target is signed (the modern `.icon` asset is untouched).
      - name: Full-bleed legacy icon
        shell: /bin/bash
        basedOnDependencyAnalysis: false
        script: /bin/bash "$SRCROOT/scripts/fullbleed-legacy-icon.sh"
  SefirahCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - SefirahCoreTests
    dependencies:
      - target: SefirahCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.madeye.sefirah.mac.core.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Sefirah:
    build:
      targets:
        Sefirah: all
        SefirahCore: all
        SefirahNotifications: all
        SefirahCoreTests: [test]
    test:
      targets:
        - SefirahCoreTests
